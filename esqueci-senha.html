<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Recuperar Senha — agenlits</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte escura.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="js/layout.js"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body class="bg-brand-main text-brand-main min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

  <header class="p-4 sm:p-6 flex items-center justify-between max-w-5xl mx-auto w-full">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/fundo transparente fonte escura.png" alt="agenlits" class="h-8 w-auto object-contain" />
    </a>
    <button type="button" class="theme-toggle-btn p-2 rounded-xl border border-brand-border bg-brand-card hover:border-brand-emerald text-brand-muted hover:text-white transition flex items-center justify-center cursor-pointer" title="Alternar tema">
      <i class="ph-bold ph-sun text-lg text-emerald-400"></i>
    </button>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-brand-emerald/10 text-brand-emerald flex items-center justify-center text-2xl mx-auto">
          <i class="ph-bold ph-key"></i>
        </div>
        <h1 class="text-2xl font-black text-brand-main">Recuperação de Senha</h1>
        <p class="text-xs text-brand-muted">Digite seu e-mail cadastrado e enviaremos um link seguro para você redefinir sua senha de acesso.</p>
      </div>

      <div id="reset-notice" class="hidden p-3.5 rounded-xl text-xs flex items-center gap-2"></div>

      <form id="form-forgot" onsubmit="return false;" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-brand-muted uppercase mb-1">Seu E-mail</label>
          <input type="email" id="reset-email" required placeholder="seuemail@exemplo.com" class="w-full px-4 py-3 bg-brand-darker border border-brand-border rounded-xl text-brand-main focus:outline-none focus:border-brand-emerald transition" />
        </div>

        <button type="submit" id="btn-submit-reset" class="btn-emerald-invert w-full py-3.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-emerald-500/20">
          <span>Enviar Link de Recuperação</span> <i class="ph-bold ph-paper-plane-tilt"></i>
        </button>
      </form>

      <div class="text-center pt-2 border-t border-brand-border">
        <a href="login.html" class="text-xs text-brand-muted hover:text-brand-emerald transition inline-flex items-center gap-1">
          <i class="ph-bold ph-arrow-left"></i> Voltar para a tela de login
        </a>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-brand-muted border-t border-brand-border">
    &copy; 2026 agenlits — Plataforma de Gestão e Agendamento.
  </footer>

  <script>
    (() => {
      const notice = document.getElementById('reset-notice');
      const btn = document.getElementById('btn-submit-reset');

      function showNotice(text, isError = false) {
        notice.textContent = text;
        notice.className = isError
          ? 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-red-950/80 border border-red-500 text-red-200'
          : 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-emerald-950/80 border border-emerald-500 text-emerald-200';
        notice.classList.remove('hidden');
      }

      document.getElementById('form-forgot').addEventListener('submit', async () => {
        const email = document.getElementById('reset-email').value.trim();
        if (!email) return showNotice('Por favor, informe seu e-mail.', true);

        btn.disabled = true;
        btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Enviando...';

        try {
          const redirectTo = window.location.origin + '/redefinir-senha.html';
          const { error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo: redirectTo
          });

          if (error) throw error;

          showNotice('✅ Link enviado com sucesso! Verifique sua caixa de entrada e spam.');
          document.getElementById('reset-email').value = '';
        } catch(err) {
          showNotice('Erro ao solicitar redefinição: ' + (err.message || 'Verifique o e-mail digitado.'), true);
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<span>Enviar Link de Recuperação</span> <i class="ph-bold ph-paper-plane-tilt"></i>';
        }
      });
    })();
  </script>
</body>
</html>
