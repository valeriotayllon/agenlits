<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastre sua Barbearia — agenlits</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte clara.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-gold selection:text-black">

  <header class="border-b border-brand-border py-4 px-6 flex items-center justify-between bg-brand-dark/80 backdrop-blur-md">
    <a href="index.html" class="flex items-center gap-2 hover:opacity-85 transition">
      <img src="images/fundo transparente fonte clara.png" alt="agenlits" class="h-8 w-auto object-contain" />
    </a>
    <div class="text-xs text-brand-muted">
      Já tem uma barbearia cadastrada? <a href="login.html" class="text-brand-gold font-semibold hover:underline">Fazer login</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-xl bg-brand-card border border-brand-border rounded-2xl p-6 sm:p-10 shadow-2xl relative">
      <div class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Cadastre sua Barbearia</h1>
        <p class="text-xs text-brand-muted mt-1">Preencha os dados abaixo para criar sua plataforma e link exclusivo.</p>
      </div>

      <div id="error-alert" class="hidden mb-4 p-4 rounded-xl bg-red-950/80 border border-red-500 text-red-200 text-xs flex items-start gap-3">
        <i class="ph-bold ph-warning-circle text-lg text-red-400 shrink-0 mt-0.5"></i>
        <div id="error-message"></div>
      </div>

      <form id="signup-form" onsubmit="return false;" class="space-y-4" autocomplete="off">
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1.5">Nome da Barbearia</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted"><i class="ph ph-storefront text-lg"></i></span>
            <input type="text" id="barbershop-name" placeholder="Ex: Barbearia do Silva" class="w-full pl-11 pr-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
          <div class="sm:col-span-6">
            <label class="block text-xs font-semibold text-slate-200 mb-1.5">WhatsApp</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted"><i class="ph ph-phone text-lg"></i></span>
              <input type="tel" id="owner-phone" placeholder="(11) 99999-9999" maxlength="15" class="w-full pl-11 pr-3 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition" />
            </div>
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-200 mb-1.5">Tipo</label>
            <div class="relative">
              <select id="doc-type" class="w-full px-2 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition appearance-none text-center cursor-pointer">
                <option value="CPF" selected>CPF</option>
                <option value="CNPJ">CNPJ</option>
              </select>
            </div>
          </div>
          <div class="sm:col-span-4">
            <label class="block text-xs font-semibold text-slate-200 mb-1.5">Documento</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted"><i class="ph ph-fingerprint text-lg"></i></span>
              <input type="text" id="doc-number" placeholder="000.000.000-00" maxlength="18" class="w-full pl-10 pr-3 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition" />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1.5">Nome Responsável</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted"><i class="ph ph-user text-lg"></i></span>
            <input type="text" id="owner-name" placeholder="Nome do administrador" class="w-full pl-11 pr-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1.5">Seu melhor e-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted"><i class="ph ph-envelope-simple text-lg"></i></span>
            <input type="email" id="owner-email" placeholder="seu@email.com" class="w-full pl-11 pr-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-200 mb-1.5">Senha</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted"><i class="ph ph-lock text-lg"></i></span>
              <input type="password" id="owner-password" minlength="6" placeholder="Mínimo 6 caracteres" class="w-full pl-11 pr-10 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition" />
              <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 flex items-center pr-3 text-brand-muted hover:text-white"><i class="ph ph-eye text-base"></i></button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-200 mb-1.5">Confirmar Senha</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted"><i class="ph ph-lock text-lg"></i></span>
              <input type="password" id="owner-confirm-password" minlength="6" placeholder="Repita a senha" class="w-full pl-11 pr-10 py-3 bg-brand-dark border border-brand-border rounded-xl text-sm text-white focus:outline-none focus:border-brand-gold transition" />
              <button type="button" id="toggle-confirm-password" class="absolute inset-y-0 right-0 flex items-center pr-3 text-brand-muted hover:text-white"><i class="ph ph-eye text-base"></i></button>
            </div>
          </div>
        </div>

        <div class="pt-1">
          <label class="block text-xs font-semibold text-slate-200 mb-1.5">Link exclusivo da sua Barbearia</label>
          <div class="flex items-center rounded-xl bg-brand-dark border border-brand-border overflow-hidden focus-within:border-brand-gold transition">
            <span class="bg-brand-dark px-3.5 py-3 text-xs text-brand-muted border-r border-brand-border font-mono select-none">agenlits.com/</span>
            <input type="text" id="barbershop-slug" placeholder="barbearia-do-silva" class="w-full px-3 py-3 bg-transparent text-sm text-brand-gold font-mono focus:outline-none" />
          </div>
        </div>

        <button type="button" id="btn-submit" class="w-full py-3.5 bg-brand-gold text-black font-bold text-sm rounded-xl hover:bg-brand-goldHover transition shadow-lg shadow-brand-gold/10 flex items-center justify-center gap-2 mt-4">
          Cadastrar Barbearia <i class="ph-bold ph-check"></i>
        </button>
      </form>

      <div id="success-modal" class="hidden absolute inset-0 bg-brand-card/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20">
        <div class="w-16 h-16 rounded-2xl bg-brand-gold/10 border border-brand-gold text-brand-gold flex items-center justify-center text-3xl mb-4">
          <i class="ph-bold ph-check-circle"></i>
        </div>
        <h3 class="text-xl font-bold text-white">Barbearia cadastrada com sucesso!</h3>
        <p class="text-xs text-brand-muted mt-2 max-w-sm" id="success-msg">Cadastro finalizado com sucesso.</p>
        <div class="mt-6 flex flex-col gap-2 w-full max-w-xs">
          <a href="login.html" class="w-full py-3 bg-brand-gold text-black text-xs font-bold rounded-lg hover:bg-brand-goldHover transition">Ir para Login</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 border-t border-brand-border text-center text-xs text-brand-muted">
    &copy; 2026 agenlits — Plataforma de Gestão e Agendamento.
  </footer>

  <script src="cadastro.js"></script>
</body>
</html>
