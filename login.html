<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Entrar — agenlits</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte escura.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('agenlits_theme') || 'dark';
      if (savedTheme === 'light') document.documentElement.classList.add('light');
      else document.documentElement.classList.remove('light');
      updateThemeIcons();
    }
    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle('light');
      localStorage.setItem('agenlits_theme', isLight ? 'light' : 'dark');
      updateThemeIcons();
    }
    function updateThemeIcons() {
      const isLight = document.documentElement.classList.contains('light');
      document.querySelectorAll('.theme-toggle-btn i').forEach(icon => {
        icon.className = isLight ? 'ph-bold ph-moon text-lg text-slate-800' : 'ph-bold ph-sun text-lg text-emerald-400';
      });
    }
    initTheme();
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.theme-toggle-btn').forEach(btn => btn.addEventListener('click', toggleTheme));
      updateThemeIcons();
    });
  </script>

<script>
  // Redirecionamento inteligente ao clicar na logo para usuários com sessão ativa
  (async function setupLogoRedirect() {
    try {
      const SUPABASE_URL = 'https://fdoceyjcibzdfiqvdzkv.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2NleWpjaWJ6ZGZpcXZkemt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODkyOTEsImV4cCI6MjEwNDk2NTI5MX0.v6Jj0Fn7u1HEAHl-zq5SZTmGxCIeHXs2a-vTSgtFm-A';
      if (!window.supabase) return;
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await client.auth.getSession();
      
      if (session && session.user) {
        const { data: shop } = await client
          .from('barbershops')
          .select('id')
          .eq('owner_id', session.user.id)
          .maybeSingle();

        const destination = shop ? 'painel.html' : 'cliente.html';

        document.addEventListener('DOMContentLoaded', () => {
          document.querySelectorAll('a[href="index.html"], a[href="painel.html"], a[href="/"]').forEach(link => {
            if (link.querySelector('img[src*="fonte escura.png"]') || link.querySelector('img[alt*="agenlits"]')) {
              link.href = destination;
            }
          });
        });
      }
    } catch (e) {
      console.error('Erro no link dinâmico da logo:', e);
    }
  })();
</script>

</head>
<body class="bg-brand-main text-brand-main min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

  <header class="border-b border-brand-border py-3.5 px-4 sm:px-6 flex items-center justify-between bg-brand-card/90 backdrop-blur-md">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/fundo transparente fonte escura.png" alt="agenlits" class="h-7 sm:h-8 w-auto object-contain" />
    </a>
    <div class="flex items-center gap-3">
      <div class="text-xs text-brand-muted hidden sm:block">
        Não tem conta? <a href="cadastro.html" class="text-brand-emerald font-semibold hover:underline">Cadastre-se</a>
      </div>
      <button type="button" class="theme-toggle-btn p-2 rounded-xl border border-brand-border bg-brand-card hover:border-brand-emerald text-brand-muted hover:text-white transition flex items-center justify-center cursor-pointer" title="Alternar tema">
        <i class="ph-bold ph-sun text-lg text-emerald-400"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      
      <!-- SELETOR DE PERFIL: CLIENTE vs BARBEARIA -->
      <div class="flex p-1 bg-brand-darker border border-brand-border rounded-2xl mb-6">
        <button type="button" id="tab-client" onclick="window.switchTab('client')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-brand-emerald text-[#272D2D] shadow-sm">
          <i class="ph-bold ph-user"></i> Sou Cliente
        </button>
        <button type="button" id="tab-owner" onclick="window.switchTab('owner')" class="flex-1 py-2.5 rounded-xl text-xs font-semibold text-brand-muted transition flex items-center justify-center gap-1.5 hover:text-brand-main">
          <i class="ph-bold ph-storefront"></i> Sou Barbeiro
        </button>
      </div>

      <div class="text-center mb-6">
        <h2 id="login-title" class="text-2xl font-bold tracking-tight">Acesse sua Conta</h2>
        <p id="login-subtitle" class="text-xs text-brand-muted mt-1">Veja seus horários agendados e histórico</p>
      </div>

      <div id="login-error" class="hidden mb-4 p-3.5 rounded-xl bg-red-950/80 border border-red-500 text-red-200 text-xs flex items-start gap-2.5">
        <i class="ph-bold ph-warning-circle text-base text-red-400 shrink-0 mt-0.5"></i>
        <div id="login-error-text"></div>
      </div>

      <form id="login-form" onsubmit="return false;" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-brand-muted mb-1.5 uppercase">E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted">
              <i class="ph ph-envelope-simple text-base"></i>
            </span>
            <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full pl-10 pr-4 py-3 bg-brand-darker border border-brand-border rounded-xl text-sm focus:outline-none focus:border-brand-emerald transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-muted mb-1.5 uppercase">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted">
              <i class="ph ph-lock text-base"></i>
            </span>
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-3 bg-brand-darker border border-brand-border rounded-xl text-sm focus:outline-none focus:border-brand-emerald transition" />
            <button type="button" id="toggle-login-pass" class="absolute inset-y-0 right-0 flex items-center pr-3 text-brand-muted hover:text-brand-main cursor-pointer">
              <i class="ph ph-eye text-base"></i>
            </button>
          </div>
        </div>

        <button type="button" id="btn-login" class="btn-emerald-invert w-full py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 mt-2 shadow-lg shadow-emerald-500/10">
          <span id="btn-login-text">Entrar como Cliente</span> <i class="ph-bold ph-sign-in"></i>
        </button>

        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-brand-border"></div>
          </div>
          <div class="relative flex justify-center text-[11px] uppercase">
            <span class="bg-brand-card px-3 text-brand-muted font-medium">Ou acesse com</span>
          </div>
        </div>

        <button type="button" id="btn-google-login" class="w-full py-3 px-4 rounded-xl border border-brand-border bg-brand-darker hover:border-brand-emerald text-brand-main text-xs font-semibold flex items-center justify-center gap-3 transition cursor-pointer shadow-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continuar com o Google</span>
        </button>
      </form>

      <div class="text-center mt-6 text-xs text-brand-muted">
        Ainda não possui conta? 
        <a id="register-redirect-link" href="cadastro.html?type=client" class="text-brand-emerald font-semibold hover:underline">Cadastre-se grátis</a>
      </div>
    </div>
  </main>

  <footer class="border-t border-brand-border py-4 text-center text-xs text-brand-muted">
    &copy; 2026 agenlits — Plataforma de Gestão e Agendamento.
  </footer>

  <script>
    (() => {
      const SUPABASE_URL = 'https://fdoceyjcibzdfiqvdzkv.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2NleWpjaWJ6ZGZpcXZkemt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODkyOTEsImV4cCI6MjEwNDk2NTI5MX0.v6Jj0Fn7u1HEAHl-zq5SZTmGxCIeHXs2a-vTSgtFm-A';
      const supabaseAuthClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let currentType = 'client';

      const tabClient = document.getElementById('tab-client');
      const tabOwner = document.getElementById('tab-owner');
      const loginTitle = document.getElementById('login-title');
      const loginSubtitle = document.getElementById('login-subtitle');
      const btnLoginText = document.getElementById('btn-login-text');
      const registerRedirectLink = document.getElementById('register-redirect-link');
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const btnLogin = document.getElementById('btn-login');
      const btnGoogle = document.getElementById('btn-google-login');
      const errorBox = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      const togglePass = document.getElementById('toggle-login-pass');

      window.switchTab = (type) => {
        currentType = type;
        if (type === 'client') {
          tabClient.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-brand-emerald text-[#272D2D] shadow-sm';
          tabOwner.className = 'flex-1 py-2.5 rounded-xl text-xs font-semibold text-brand-muted transition flex items-center justify-center gap-1.5 hover:text-brand-main';
          loginTitle.textContent = 'Acesse sua Conta';
          loginSubtitle.textContent = 'Veja seus horários agendados e histórico';
          btnLoginText.textContent = 'Entrar como Cliente';
          registerRedirectLink.href = 'cadastro.html?type=client';
        } else {
          tabOwner.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-brand-emerald text-[#272D2D] shadow-sm';
          tabClient.className = 'flex-1 py-2.5 rounded-xl text-xs font-semibold text-brand-muted transition flex items-center justify-center gap-1.5 hover:text-brand-main';
          loginTitle.textContent = 'Entrar na Barbearia';
          loginSubtitle.textContent = 'Acesse a gestão, agenda, barbeiros e serviços';
          btnLoginText.textContent = 'Entrar no Painel da Barbearia';
          registerRedirectLink.href = 'cadastro.html?type=owner';
        }
      };

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('type') === 'owner') window.switchTab('owner');

      if (togglePass) {
        togglePass.addEventListener('click', () => {
          const isPass = passwordInput.type === 'password';
          passwordInput.type = isPass ? 'text' : 'password';
          togglePass.querySelector('i').className = isPass ? 'ph ph-eye-slash text-base' : 'ph ph-eye text-base';
        });
      }

      function showError(msg) {
        errorText.textContent = msg;
        errorBox.classList.remove('hidden');
      }

      function hideError() {
        errorBox.classList.add('hidden');
      }

      function getFriendlyErrorMessage(err) {
        const msg = (err.message || '').toLowerCase();
        if (msg.includes('invalid login credentials') || msg.includes('user not found')) {
          return 'Usuário não encontrado ou dados incorretos. Verifique o e-mail e a senha digitados ou faça seu cadastro.';
        }
        if (msg.includes('email not confirmed')) {
          return 'Este e-mail ainda não foi confirmado. Verifique sua caixa de entrada.';
        }
        if (msg.includes('too many requests') || msg.includes('rate limit')) {
          return 'Muitas tentativas consecutivas. Aguarde alguns instantes antes de tentar novamente.';
        }
        return err.message || 'Não foi possível entrar. Verifique os dados e tente novamente.';
      }

      async function handleLogin() {
        hideError();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email) return showError('Por favor, informe seu e-mail.');
        if (!password) return showError('Por favor, digite sua senha.');

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg"></i> Entrando...';

        try {
          const { data, error } = await supabaseAuthClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          const user = data.user;

          // Se o usuário selecionou a aba "Sou Cliente":
          if (currentType === 'client') {
            // Garante que o cliente existe na tabela clients
            try {
              const { data: existingClient } = await supabaseAuthClient
                .from('clients')
                .select('id')
                .eq('auth_user_id', user.id)
                .maybeSingle();

              if (!existingClient) {
                // Cria o registro na tabela clients caso ainda não exista
                await supabaseAuthClient.from('clients').insert([{
                  auth_user_id: user.id,
                  name: user.user_metadata?.full_name || email.split('@')[0],
                  email: email,
                  phone: user.phone || ''
                }]);
              }
            } catch (e) {
              console.log('Cliente já existente ou erro de inserção:', e);
            }

            localStorage.setItem('agenlits_user_type', 'client');
            window.location.href = 'cliente.html';
            return;
          }

          // Se o usuário selecionou a aba "Sou Barbeiro / Dono":
          if (currentType === 'owner') {
            const { data: shop } = await supabaseAuthClient
              .from('barbershops')
              .select('id, name')
              .eq('owner_id', user.id)
              .maybeSingle();

            if (!shop) {
              await supabaseAuthClient.auth.signOut();
              showError('Nenhuma barbearia vinculada a esta conta. Cadastre seu estabelecimento na aba de cadastro.');
              btnLogin.disabled = false;
              btnLogin.innerHTML = `<span id="btn-login-text">${btnLoginText.textContent}</span> <i class="ph-bold ph-sign-in"></i>`;
              return;
            }

            localStorage.setItem('agenlits_user_type', 'owner');
            window.location.href = 'painel.html';
            return;
          }

        } catch (err) {
          showError(getFriendlyErrorMessage(err));
          btnLogin.disabled = false;
          btnLogin.innerHTML = `<span id="btn-login-text">${btnLoginText.textContent}</span> <i class="ph-bold ph-sign-in"></i>`;
        }
      } catch (err) {
          showError(getFriendlyErrorMessage(err));
          btnLogin.disabled = false;
          btnLogin.innerHTML = `<span id="btn-login-text">${btnLoginText.textContent}</span> <i class="ph-bold ph-sign-in"></i>`;
        }
      }

      btnLogin.addEventListener('click', handleLogin);
      passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
      emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

      if (btnGoogle) {
        btnGoogle.addEventListener('click', async () => {
          btnGoogle.disabled = true;
          btnGoogle.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-base text-brand-emerald"></i> Conectando...';
          try {
            const dest = currentType === 'owner' ? '/painel.html' : '/index.html';
            const redirectUrl = window.location.origin.includes('localhost') 
              ? window.location.origin + dest 
              : 'https://3lits-agenlits.vercel.app' + dest;

            const { error } = await supabaseAuthClient.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo: redirectUrl }
            });
            if (error) throw error;
          } catch (err) {
            showError(err.message || 'Falha ao conectar com o Google.');
            btnGoogle.disabled = false;
            btnGoogle.innerHTML = 'Continuar com o Google';
          }
        });
      }
    })();
  </script>
</body>
</html>
