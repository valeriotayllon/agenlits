<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar no Painel — agenlits</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte clara.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
  
<script>
  function initTheme() {
    const savedTheme = localStorage.getItem('agenlits_theme') || 'dark';
    if (savedTheme === 'light') {
      document.documentElement.classList.add('light');
    } else {
      document.documentElement.classList.remove('light');
    }
    updateThemeIcons();
  }

  function toggleTheme() {
    const isLight = document.documentElement.classList.toggle('light');
    localStorage.setItem('agenlits_theme', isLight ? 'light' : 'dark');
    updateThemeIcons();
  }

  function updateThemeIcons() {
    const isLight = document.documentElement.classList.contains('light');
    document.querySelectorAll('.theme-toggle-btn i').forEach(icon => {
      icon.className = isLight ? 'ph-bold ph-moon text-lg text-slate-800' : 'ph-bold ph-sun text-lg text-emerald-400';
    });
  }

  initTheme();
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
      btn.addEventListener('click', toggleTheme);
    });
    updateThemeIcons();
  });
</script>

</head>
<body class="bg-brand-main text-brand-main min-h-screen flex flex-col justify-between">

  <header class="border-b border-brand-border py-4 px-6 flex items-center justify-between bg-brand-card/90 backdrop-blur-md">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/fundo transparente fonte clara.png" alt="agenlits" class="h-8 w-auto object-contain" />
    </a>
    <div class="flex items-center gap-3">
      <div class="text-xs text-brand-muted hidden sm:block">
        Ainda não tem conta? <a href="cadastro.html" class="text-brand-emerald font-semibold hover:underline">Cadastre-se grátis</a>
      </div>
      
<button type="button" class="theme-toggle-btn p-2 rounded-xl border border-brand-border bg-brand-card hover:border-brand-emerald text-brand-muted hover:text-white transition flex items-center justify-center cursor-pointer" title="Alternar tema claro/escuro" aria-label="Mudar tema">
  <i class="ph-bold ph-sun text-lg text-emerald-400"></i>
</button>

    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold tracking-tight">Entrar na sua Barbearia</h2>
        <p class="text-xs text-brand-muted mt-1">Acesse a gestão, agenda e métricas</p>
      </div>

      <div id="login-error" class="hidden mb-4 p-3.5 rounded-xl bg-red-950/80 border border-red-500 text-red-200 text-xs flex items-start gap-2.5">
        <i class="ph-bold ph-warning-circle text-base text-red-400 shrink-0 mt-0.5"></i>
        <div id="login-error-text"></div>
      </div>

      <form id="login-form" onsubmit="return false;" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-brand-muted mb-1.5 uppercase">E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted">
              <i class="ph ph-envelope-simple text-base"></i>
            </span>
            <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full pl-10 pr-4 py-3 bg-brand-darker border border-brand-border rounded-xl text-sm focus:outline-none focus:border-brand-emerald transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-muted mb-1.5 uppercase">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-muted">
              <i class="ph ph-lock text-base"></i>
            </span>
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-3 bg-brand-darker border border-brand-border rounded-xl text-sm focus:outline-none focus:border-brand-emerald transition" />
            <button type="button" id="toggle-login-pass" class="absolute inset-y-0 right-0 flex items-center pr-3 text-brand-muted hover:text-brand-main">
              <i class="ph ph-eye text-base"></i>
            </button>
          </div>
        </div>

        <button type="button" id="btn-login" class="btn-emerald-invert w-full py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 mt-4 shadow-lg shadow-emerald-500/10">
          Entrar na Minha Barbearia <i class="ph-bold ph-sign-in"></i>
        </button>
      </form>
    </div>
  </main>

  <footer class="border-t border-brand-border py-4 text-center text-xs text-brand-muted">
    &copy; 2026 agenlits — Plataforma de Gestão e Agendamento.
  </footer>

  <script>
    (() => {
      const SUPABASE_URL = 'https://fdoceyjcibzdfiqvdzkv.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2NleWpjaWJ6ZGZpcXZkemt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODkyOTEsImV4cCI6MjEwNDk2NTI5MX0.v6Jj0Fn7u1HEAHl-zq5SZTmGxCIeHXs2a-vTSgtFm-A';
      const supabaseAuthClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const btnLogin = document.getElementById('btn-login');
      const errorBox = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      const togglePass = document.getElementById('toggle-login-pass');

      if (togglePass) {
        togglePass.addEventListener('click', () => {
          const isPass = passwordInput.type === 'password';
          passwordInput.type = isPass ? 'text' : 'password';
          togglePass.querySelector('i').className = isPass ? 'ph ph-eye-slash text-base' : 'ph ph-eye text-base';
        });
      }

      function showError(msg) {
        errorText.textContent = msg;
        errorBox.classList.remove('hidden');
      }

      function hideError() {
        errorBox.classList.add('hidden');
      }

      async function handleLogin() {
        hideError();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email) return showError('Por favor, informe seu e-mail.');
        if (!password) return showError('Por favor, digite sua senha.');

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg"></i> Validando acesso...';

        try {
          const { data, error } = await supabaseAuthClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'painel.html';
        } catch (err) {
          showError(err.message || 'Erro ao realizar login.');
          btnLogin.disabled = false;
          btnLogin.innerHTML = 'Entrar na Minha Barbearia <i class="ph-bold ph-sign-in"></i>';
        }
      }

      btnLogin.addEventListener('click', handleLogin);
      passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
      emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
    })();
  </script>
</body>
</html>
