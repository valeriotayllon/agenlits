<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horários de Atendimento — agenlits</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte clara.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-gold selection:text-black">

  <header class="sticky top-0 z-40 bg-brand-dark/95 backdrop-blur-md border-b border-brand-border px-4 sm:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="painel.html" class="flex items-center gap-2">
        <img src="images/fundo transparente fonte clara.png" alt="agenlits" class="h-8 w-auto object-contain" />
      </a>
      <span class="text-xs px-2.5 py-1 font-semibold rounded-md bg-brand-card border border-brand-border text-brand-gold">
        Horários de Atendimento
      </span>
    </div>
    <a href="painel.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:text-white bg-brand-card border border-brand-border hover:border-brand-gold transition">
      <i class="ph-bold ph-arrow-left"></i> Voltar ao Painel
    </a>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-8 py-8 space-y-6">
    <div>
      <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
        <i class="ph-bold ph-clock text-brand-gold"></i> Horários de Funcionamento
      </h1>
      <p class="text-xs text-brand-muted mt-1">Configure os dias e horários em que sua barbearia estará disponível para agendamentos automáticos.</p>
    </div>

    <div id="status-msg" class="hidden p-3.5 rounded-xl text-xs flex items-center gap-2"></div>

    <div class="bg-brand-card border border-brand-border rounded-2xl p-6 sm:p-8 shadow-xl space-y-6">
      <div id="days-container" class="space-y-4">
        <!-- Renderizado dinamicamente -->
      </div>

      <div class="pt-4 border-t border-brand-border flex justify-end">
        <button type="button" id="btn-save-hours" class="px-6 py-3 bg-brand-gold text-black font-bold text-xs rounded-xl hover:bg-brand-goldHover transition shadow-lg shadow-brand-gold/10 flex items-center gap-2">
          Salvar Horários de Atendimento <i class="ph-bold ph-check"></i>
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-brand-border py-4 text-center text-xs text-brand-muted">
    &copy; 2026 agenlits — Plataforma de Gestão e Agendamento.
  </footer>

  <script>
    (() => {
      const SUPABASE_URL = 'https://fdoceyjcibzdfiqvdzkv.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2NleWpjaWJ6ZGZpcXZkemt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODkyOTEsImV4cCI6MjEwNDk2NTI5MX0.v6Jj0Fn7u1HEAHl-zq5SZTmGxCIeHXs2a-vTSgtFm-A';
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const daysOfWeek = [
        { day: 1, name: 'Segunda-feira' },
        { day: 2, name: 'Terça-feira' },
        { day: 3, name: 'Quarta-feira' },
        { day: 4, name: 'Quinta-feira' },
        { day: 5, name: 'Sexta-feira' },
        { day: 6, name: 'Sábado' },
        { day: 0, name: 'Domingo' }
      ];

      let currentShopId = null;
      const daysContainer = document.getElementById('days-container');
      const btnSave = document.getElementById('btn-save-hours');
      const statusMsg = document.getElementById('status-msg');

      function showNotice(text, isError = false) {
        statusMsg.textContent = text;
        statusMsg.className = isError 
          ? 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-red-950/80 border border-red-500 text-red-200'
          : 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-emerald-950/80 border border-emerald-500 text-emerald-200';
        statusMsg.classList.remove('hidden');
        setTimeout(() => statusMsg.classList.add('hidden'), 4000);
      }

      async function init() {
        const { data: { session } } = await client.auth.getSession();
        if (!session) return window.location.href = 'login.html';

        const { data: shop } = await client.from('barbershops').select('id').eq('owner_id', session.user.id).single();
        if (!shop) return;
        currentShopId = shop.id;

        const { data: savedHours } = await client.from('business_hours').select('*').eq('barbershop_id', currentShopId);
        const map = {};
        if (savedHours) savedHours.forEach(h => { map[h.day_of_week] = h; });

        daysContainer.innerHTML = daysOfWeek.map(d => {
          const item = map[d.day] || {
            open_time: '09:00',
            close_time: '19:00',
            is_closed: d.day === 0 // Domingo fechado por padrão
          };

          return `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl bg-brand-dark border border-brand-border gap-4">
              <div class="w-40 font-semibold text-sm text-white">${d.name}</div>
              
              <div class="flex items-center gap-4 flex-1">
                <label class="flex items-center gap-2 text-xs text-brand-muted cursor-pointer">
                  <input type="checkbox" id="closed-${d.day}" ${item.is_closed ? 'checked' : ''} onchange="window.toggleDay(${d.day})" class="w-4 h-4 rounded text-brand-gold focus:ring-brand-gold bg-brand-card border-brand-border" />
                  <span>Fechado</span>
                </label>

                <div id="times-${d.day}" class="flex items-center gap-2 ${item.is_closed ? 'opacity-30 pointer-events-none' : ''}">
                  <input type="time" id="open-${d.day}" value="${item.open_time || '09:00'}" class="px-2.5 py-1.5 bg-brand-card border border-brand-border rounded-lg text-xs text-white focus:outline-none focus:border-brand-gold" />
                  <span class="text-xs text-brand-muted">até</span>
                  <input type="time" id="close-${d.day}" value="${item.close_time || '19:00'}" class="px-2.5 py-1.5 bg-brand-card border border-brand-border rounded-lg text-xs text-white focus:outline-none focus:border-brand-gold" />
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      window.toggleDay = (day) => {
        const isClosed = document.getElementById(`closed-${day}`).checked;
        const timesDiv = document.getElementById(`times-${day}`);
        if (isClosed) {
          timesDiv.classList.add('opacity-30', 'pointer-events-none');
        } else {
          timesDiv.classList.remove('opacity-30', 'pointer-events-none');
        }
      };

      btnSave.addEventListener('click', async () => {
        btnSave.disabled = true;
        btnSave.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Salvando horários...';

        const payload = daysOfWeek.map(d => {
          const isClosed = document.getElementById(`closed-${d.day}`).checked;
          const openTime = document.getElementById(`open-${d.day}`).value;
          const closeTime = document.getElementById(`close-${d.day}`).value;

          return {
            barbershop_id: currentShopId,
            day_of_week: d.day,
            day_name: d.name,
            open_time: openTime,
            close_time: closeTime,
            is_closed: isClosed
          };
        });

        const { error } = await client.from('business_hours').upsert(payload, { onConflict: 'barbershop_id,day_of_week' });

        btnSave.disabled = false;
        btnSave.innerHTML = 'Salvar Horários de Atendimento <i class="ph-bold ph-check"></i>';

        if (error) return showNotice('Erro ao salvar horários: ' + error.message, true);
        showNotice('Horários atualizados com sucesso!');
      });

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
