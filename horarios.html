<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horários de Atendimento — agenlits</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css" />
  
<script>
  function initTheme() {
    const savedTheme = localStorage.getItem('agenlits_theme') || 'dark';
    if (savedTheme === 'light') {
      document.documentElement.classList.add('light');
    } else {
      document.documentElement.classList.remove('light');
    }
    updateThemeIcons();
  }

  function toggleTheme() {
    const isLight = document.documentElement.classList.toggle('light');
    localStorage.setItem('agenlits_theme', isLight ? 'light' : 'dark');
    updateThemeIcons();
  }

  function updateThemeIcons() {
    const isLight = document.documentElement.classList.contains('light');
    document.querySelectorAll('.theme-toggle-btn i').forEach(icon => {
      icon.className = isLight ? 'ph-bold ph-moon text-lg text-slate-800' : 'ph-bold ph-sun text-lg text-emerald-400';
    });
  }

  initTheme();
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
      btn.addEventListener('click', toggleTheme);
    });
    updateThemeIcons();
  });
</script>

<body class="bg-brand-main text-brand-main min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-40 bg-brand-card/95 backdrop-blur-md border-b border-brand-border px-4 sm:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-4">

        <img src="images/fundo transparente fonte escura.png" alt="agenlits" class="h-8 w-auto object-contain" />
      </a>
      <span class="text-xs px-2.5 py-1 font-semibold rounded-md bg-brand-darker border border-brand-border text-brand-emerald">
        Horários de Atendimento
      </span>
    </div>
    <div class="flex items-center gap-3">
      
<button type="button" class="theme-toggle-btn p-2 rounded-xl border border-brand-border bg-brand-card hover:border-brand-emerald text-brand-muted hover:text-white transition flex items-center justify-center cursor-pointer" title="Alternar tema claro/escuro" aria-label="Mudar tema">
  <i class="ph-bold ph-sun text-lg text-emerald-400"></i>
</button>

      <a href="painel.html" class="btn-secondary-invert flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs">
        <i class="ph-bold ph-arrow-left"></i> Painel
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-8 py-8 space-y-6">
    <div>
      <h1 class="text-2xl font-extrabold flex items-center gap-2">
        <i class="ph-bold ph-clock text-brand-emerald"></i> Horários de Funcionamento
      </h1>
      <p class="text-xs text-brand-muted mt-1">Configure os horários em que os clientes podem agendar.</p>
    </div>

    <div id="status-msg" class="hidden p-3.5 rounded-xl text-xs flex items-center gap-2"></div>

    <div class="bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
      <div id="days-container" class="space-y-4"></div>

      <div class="pt-4 border-t border-brand-border flex justify-end">
        <button type="button" id="btn-save-hours" class="btn-emerald-invert px-6 py-3 rounded-xl text-xs flex items-center gap-2">
          Salvar Horários de Atendimento <i class="ph-bold ph-check"></i>
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-brand-border py-4 text-center text-xs text-brand-muted">
    &copy; 2026 agenlits — Plataforma de Gestão e Agendamento.
  </footer>

  <script>
    (() => {
      const SUPABASE_URL = 'https://fdoceyjcibzdfiqvdzkv.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2NleWpjaWJ6ZGZpcXZkemt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODkyOTEsImV4cCI6MjEwNDk2NTI5MX0.v6Jj0Fn7u1HEAHl-zq5SZTmGxCIeHXs2a-vTSgtFm-A';
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const daysOfWeek = [
        { day: 1, name: 'Segunda-feira' },
        { day: 2, name: 'Terça-feira' },
        { day: 3, name: 'Quarta-feira' },
        { day: 4, name: 'Quinta-feira' },
        { day: 5, name: 'Sexta-feira' },
        { day: 6, name: 'Sábado' },
        { day: 0, name: 'Domingo' }
      ];

      let currentShopId = null;
      const daysContainer = document.getElementById('days-container');
      const btnSave = document.getElementById('btn-save-hours');
      const statusMsg = document.getElementById('status-msg');

      function showNotice(text, isError = false) {
        statusMsg.textContent = text;
        statusMsg.className = isError 
          ? 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-red-950/80 border border-red-500 text-red-200'
          : 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-emerald-950/80 border border-emerald-500 text-emerald-200';
        statusMsg.classList.remove('hidden');
        setTimeout(() => statusMsg.classList.add('hidden'), 4000);
      }

      async function init() {
        const { data: { session } } = await client.auth.getSession();
        if (!session) return window.location.href = 'login.html';

        const { data: shop } = await client.from('barbershops').select('id').eq('owner_id', session.user.id).single();
        if (!shop) return;
        currentShopId = shop.id;

        const { data: savedHours } = await client.from('business_hours').select('*').eq('barbershop_id', currentShopId);
        const map = {};
        if (savedHours) savedHours.forEach(h => { map[h.day_of_week] = h; });

        daysContainer.innerHTML = daysOfWeek.map(d => {
          const item = map[d.day] || { open_time: '09:00', close_time: '19:00', is_closed: d.day === 0 };
          return `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-2xl bg-brand-darker border border-brand-border gap-4">
              <div class="w-40 font-semibold text-sm">${d.name}</div>
              <div class="flex items-center gap-4 flex-1">
                <label class="flex items-center gap-2 text-xs text-brand-muted cursor-pointer">
                  <input type="checkbox" id="closed-${d.day}" ${item.is_closed ? 'checked' : ''} onchange="window.toggleDay(${d.day})" class="w-4 h-4 rounded text-brand-emerald focus:ring-brand-emerald bg-brand-card border-brand-border" />
                  <span>Fechado</span>
                </label>
                <div id="times-${d.day}" class="flex items-center gap-2 ${item.is_closed ? 'opacity-30 pointer-events-none' : ''}">
                  <input type="time" id="open-${d.day}" value="${item.open_time || '09:00'}" class="px-2.5 py-1.5 bg-brand-card border border-brand-border rounded-lg text-xs focus:outline-none focus:border-brand-emerald" />
                  <span class="text-xs text-brand-muted">até</span>
                  <input type="time" id="close-${d.day}" value="${item.close_time || '19:00'}" class="px-2.5 py-1.5 bg-brand-card border border-brand-border rounded-lg text-xs focus:outline-none focus:border-brand-emerald" />
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      window.toggleDay = (day) => {
        const isClosed = document.getElementById('closed-' + day).checked;
        const timesDiv = document.getElementById('times-' + day);
        if (isClosed) timesDiv.classList.add('opacity-30', 'pointer-events-none');
        else timesDiv.classList.remove('opacity-30', 'pointer-events-none');
      };

      btnSave.addEventListener('click', async () => {
        btnSave.disabled = true;
        btnSave.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Salvando...';

        const payload = daysOfWeek.map(d => ({
          barbershop_id: currentShopId,
          day_of_week: d.day,
          day_name: d.name,
          open_time: document.getElementById('open-' + d.day).value,
          close_time: document.getElementById('close-' + d.day).value,
          is_closed: document.getElementById('closed-' + d.day).checked
        }));

        await client.from('business_hours').upsert(payload, { onConflict: 'barbershop_id,day_of_week' });
        btnSave.disabled = false;
        btnSave.innerHTML = 'Salvar Horários de Atendimento <i class="ph-bold ph-check"></i>';
        showNotice('Horários atualizados com sucesso!');
      });

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
