<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Redefinir Nova Senha — agenlits</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte escura.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="js/layout.js"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body class="bg-brand-main text-brand-main min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

  <header class="p-4 sm:p-6 flex items-center justify-between max-w-5xl mx-auto w-full">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/fundo transparente fonte escura.png" alt="agenlits" class="h-8 w-auto object-contain" />
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-brand-emerald/10 text-brand-emerald flex items-center justify-center text-2xl mx-auto">
          <i class="ph-bold ph-lock-key"></i>
        </div>
        <h1 class="text-2xl font-black text-brand-main">Criar Nova Senha</h1>
        <p class="text-xs text-brand-muted">Defina uma nova senha segura para acessar sua conta na plataforma.</p>
      </div>

      <div id="newpwd-notice" class="hidden p-3.5 rounded-xl text-xs flex items-center gap-2"></div>

      <form id="form-newpwd" onsubmit="return false;" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-brand-muted uppercase mb-1">Nova Senha (Mínimo 6 caracteres)</label>
          <input type="password" id="new-password" required minlength="6" placeholder="••••••••" class="w-full px-4 py-3 bg-brand-darker border border-brand-border rounded-xl text-brand-main focus:outline-none focus:border-brand-emerald transition" />
        </div>

        <div>
          <label class="block font-bold text-brand-muted uppercase mb-1">Confirme a Nova Senha</label>
          <input type="password" id="confirm-password" required minlength="6" placeholder="••••••••" class="w-full px-4 py-3 bg-brand-darker border border-brand-border rounded-xl text-brand-main focus:outline-none focus:border-brand-emerald transition" />
        </div>

        <button type="submit" id="btn-save-pwd" class="btn-emerald-invert w-full py-3.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-emerald-500/20">
          <span>Salvar Nova Senha</span> <i class="ph-bold ph-check"></i>
        </button>
      </form>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-brand-muted border-t border-brand-border">
    &copy; 2026 agenlits — Plataforma de Gestão e Agendamento.
  </footer>

  <script>
    (() => {
      const notice = document.getElementById('newpwd-notice');
      const btn = document.getElementById('btn-save-pwd');

      function showNotice(text, isError = false) {
        notice.textContent = text;
        notice.className = isError
          ? 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-red-950/80 border border-red-500 text-red-200'
          : 'p-3.5 rounded-xl text-xs flex items-center gap-2 bg-emerald-950/80 border border-emerald-500 text-emerald-200';
        notice.classList.remove('hidden');
      }

      document.getElementById('form-newpwd').addEventListener('submit', async () => {
        const pwd = document.getElementById('new-password').value;
        const confirmPwd = document.getElementById('confirm-password').value;

        if (pwd.length < 6) return showNotice('A senha deve ter pelo menos 6 caracteres.', true);
        if (pwd !== confirmPwd) return showNotice('As senhas digitadas não coincidem.', true);

        btn.disabled = true;
        btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Salvando nova senha...';

        try {
          const { error } = await client.auth.updateUser({ password: pwd });
          if (error) throw error;

          showNotice('🎉 Senha alterada com sucesso! Redirecionando para o login...');
          setTimeout(() => window.location.href = 'login.html', 2000);
        } catch(err) {
          showNotice('Erro ao redefinir senha: ' + (err.message || 'Token expirado. Solicite novo link.'), true);
          btn.disabled = false;
          btn.innerHTML = '<span>Salvar Nova Senha</span> <i class="ph-bold ph-check"></i>';
        }
      });
    })();
  </script>
</body>
</html>
